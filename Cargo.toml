[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# Общие зависимости воркспейса добавляются здесь, например:
# anyhow = "1"
bevy = "0.20.1"
avian3d = "0.8.0"

# Сторонние зависимости собираются с оптимизацией даже в dev-профиле.
#
# Bevy и avian3d без оптимизации работают в разы медленнее: в debug-сборке
# физика, ECS и рендер тратят большую часть кадра на непроинлайненный код.
# При этом сам воркспейс остаётся неоптимизированным, поэтому пересборка
# после правок в наших крейтах по-прежнему занимает секунды, а не минуты.
[profile.dev.package."*"]
opt-level = 3
